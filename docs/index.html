<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>vLLM Latency — Llama 8B (TP=2)</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
  <style>
    :root { --fg:#0f172a; --muted:#475569; --card:#fff; --bg:#f8fafc; }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
    .wrap{max-width:1100px;margin:32px auto;padding:0 16px}
    header{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-bottom:12px}
    a{color:#2563eb;text-decoration:none}
    canvas{background:var(--card);border-radius:16px;box-shadow:0 10px 30px rgba(2,6,23,.06);padding:16px}
    .muted{color:var(--muted)}
    code{background:#e2e8f0;padding:2px 6px;border-radius:6px}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>vLLM Latency — Llama 8B (TP=2)</h1>
      <a class="muted" href="./data/latency_history.json">raw JSON</a>
    </header>
    <p class="muted">Auto-updated hourly from GitHub Actions. Lines show <em>Avg</em> and <em>P95</em> latency per batch size.</p>
    <canvas id="chart" height="120"></canvas>
  </div>
  <script>
    async function main(){
      const resp = await fetch('./data/latency_history.json', {cache:'no-store'});
      const hist = await resp.json();
      const by = {};
  
      const toMs = v => (v == null ? null : (v < 50 ? v * 1000 : v)); // sec→ms heuristic
      const q = (arr, p) => {
        if (!arr || !arr.length) return null;
        const s=[...arr].sort((a,b)=>a-b);
        const idx = Math.floor((s.length - 1) * p);
        return s[idx];
      };
      const getPxx = (m, p) => {
        // direct fields if present
        const direct = m[`p${p}_latency`] ?? m[`p${p}`] ?? m[`p${p}_latency_s`];
        if (direct != null) return direct;
        // nested "percentiles"
        const per = m.percentiles || {};
        if (per[p] != null) return per[p];
        if (per[String(p)] != null) return per[String(p)];
        // compute from raw latencies as last resort
        return q(m.latencies, p/100);
      };
  
      for (const r of hist) {
        const m = r.metrics;
        const t = new Date(r.ts);
        const bs = r.batch_size;
  
        const avg = m.avg_latency ?? m.avg_latency_s ?? m.avg_latency_seconds ?? null;
        const p95 = getPxx(m, 95) ?? getPxx(m, 90) ?? getPxx(m, 99) ?? null; // try 95, then 90, then 99
  
        if (avg == null && p95 == null) continue; // nothing to plot
  
        by[bs] ||= { avg: [], p95: [] };
        if (avg != null) by[bs].avg.push({ x: t, y: toMs(avg) });
        if (p95 != null) by[bs].p95.push({ x: t, y: toMs(p95) });
      }
  
      const ds = [];
      const add = (label, key) => Object.keys(by).sort((a,b)=>a-b).forEach(bs => {
        if (by[bs][key].length) {
          ds.push({ label: `${label} (bs=${bs})`, data: by[bs][key], borderWidth: 2, fill: false, tension: .2 });
        }
      });
      add('Avg ms','avg'); add('P95 ms','p95');
  
      new Chart(document.getElementById('chart').getContext('2d'), {
        type: 'line',
        data: { datasets: ds },
        options: {
          parsing: false,
          interaction: { mode: 'nearest', intersect: false },
          scales: { x: { type: 'time' }, y: { title: { display: true, text: 'Latency (ms)' } } },
          plugins: { legend: { position: 'bottom' } }
        }
      });
    }
    main();
  </script>
</body>
</html>
