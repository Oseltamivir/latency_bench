<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>vLLM Latency — Llama 8B (TP=2)</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    :root { --fg:#0f172a; --muted:#475569; --card:#fff; --bg:#f8fafc; }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
    .wrap{max-width:1100px;margin:32px auto;padding:0 16px}
    header{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-bottom:12px}
    a{color:#2563eb;text-decoration:none}
    .controls{display:flex;gap:12px;align-items:center;margin:8px 0 16px}
    .chart-wrap{background:var(--card);border-radius:16px;box-shadow:0 10px 30px rgba(2,6,23,.06);padding:16px}
    .muted{color:var(--muted)}
    #chart{width:100%;height:480px}
    select{padding:6px 8px;border-radius:8px;border:1px solid #cbd5e1;background:#fff}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>vLLM Latency — Llama 8B (TP=2)</h1>
      <a class="muted" href="./data/latency_history.json">raw JSON</a>
    </header>
    <p class="muted">
      Each point shows a <strong>distribution</strong> of per-iteration latencies for a run; an <em>Avg ms</em> line overlays the trend per batch size.
    </p>
    <div class="controls">
      <label class="muted" for="mode">Distribution type:</label>
      <select id="mode">
        <option value="box" selected>Box & whisker</option>
        <option value="violin">Violin</option>
      </select>
    </div>
    <div class="chart-wrap"><div id="chart"></div></div>
  </div>

  <script>
    const toMs = v => (v < 50 ? v * 1000 : v);
    const tsLabel = iso => {
      const d = new Date(iso);
      // Nice, stable category label (YYYY-MM-DD HH:MM)
      const pad = n => String(n).padStart(2,'0');
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    };

    async function loadHist(){
      const r = await fetch('./data/latency_history.json', {cache:'no-store'});
      if (!r.ok) throw new Error('Failed to load latency_history.json');
      return await r.json();
    }

    function build(labelsOrdered, hist, mode){
      // Group runs by batch size
      const byBS = new Map();
      for (const r of hist) {
        const bs = r.batch_size;
        const lbl = tsLabel(r.ts);
        const lats = (r.metrics?.latencies || []).map(toMs);
        const avg  = toMs(r.metrics?.avg_latency ?? NaN);
        if (!byBS.has(bs)) byBS.set(bs, { x: [], y: [], xAvg: [], yAvg: [] });
        // For box/violin, we add one Y per latency sample and repeat the timestamp label
        for (const v of lats){ byBS.get(bs).x.push(lbl); byBS.get(bs).y.push(v); }
        if (!Number.isNaN(avg)) { byBS.get(bs).xAvg.push(lbl); byBS.get(bs).yAvg.push(avg); }
      }

      const traces = [];
      for (const [bs, obj] of byBS.entries()){
        traces.push({
          type: mode, name: `bs=${bs}`,
          x: obj.x, y: obj.y,
          boxpoints: (mode==='box' ? 'outliers' : false),
          // Violin looks better with some smoothing
          ...(mode==='violin' ? { points: 'outliers', spanmode: 'hard' } : {})
        });
        traces.push({
          type: 'scatter', mode: 'lines+markers',
          name: `Avg ms (bs=${bs})`,
          x: obj.xAvg, y: obj.yAvg,
          hovertemplate: 'Avg: %{y:.1f} ms<br>%{x}<extra></extra>',
        });
      }

      // Ensure timestamps appear in chronological order on a categorical axis
      const labelsSet = new Set(labelsOrdered);
      const categoryArray = Array.from(labelsSet).sort(); // ISO-like strings sort chronologically

      const layout = {
        margin: {l:60,r:20,t:10,b:60},
        xaxis: { title:'Run timestamp', type:'category', categoryorder:'array', categoryarray: categoryArray, tickangle:-20 },
        yaxis: { title:'Latency (ms)', rangemode:'auto' },
        legend: { orientation:'h', x:0, y:1.1 },
        boxmode: 'group',
        violinmode: 'group',
        hovermode: 'x unified',
      };
      return { traces, layout };
    }

    (async ()=>{
      const hist = await loadHist();

      // Precompute label order once
      const labelOrder = hist.map(r => tsLabel(r.ts));

      const chartEl = document.getElementById('chart');
      const sel = document.getElementById('mode');

      function render(){
        const { traces, layout } = build(labelOrder, hist, sel.value);
        Plotly.react(chartEl, traces, layout, {responsive:true, displayModeBar:false});
      }
      render();
      sel.addEventListener('change', render);
    })();
  </script>
</body>
</html>
