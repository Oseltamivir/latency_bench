<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>vLLM Latency — Llama 1B</title>

  <!-- DM Sans -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

  <style>
    :root{
      /* Dark theme tuned to match the screenshot */
      --bg:#0b0f12;        /* page + plot bg */
      --card:#0b0f12;      /* panel bg (blend) */
      --fg:#e5e7eb;        /* primary text */
      --muted:#d4e2f5;     /* secondary text */
      --grid:#2b3036;      /* grid lines */
      --axis:#cbd5e1;      /* tick/axis labels */
      --shadow:0 14px 40px rgba(0,0,0,.45);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:var(--bg);
      color:var(--fg);
      font:16px/1.45 "DM Sans", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      text-rendering:optimizeLegibility;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }
    .wrap{max-width:1200px;margin:32px auto;padding:0 20px}
    header{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:flex-end;margin-bottom:12px}
    h1{font-size:24px;margin:0;font-weight:600;letter-spacing:.2px}
    a{color:#60a5fa;text-decoration:none}
    a.muted{color:var(--muted)}
    .chart-wrap{
      background:var(--card);
      border-radius:16px;
      box-shadow:var(--shadow);
      padding:12px 12px 4px;
    }
    #chart{width:100%;height:560px}
    #gsm8kChart{width:100%;height:420px}
    p.muted{color:var(--muted);margin-top:4px}
    /* GPU popup */
    .gpu-popup{position:absolute;z-index:30;pointer-events:none;min-width:200px;
      background:#111827;border:1px solid #374151;border-radius:10px;padding:10px 12px;
      box-shadow:var(--shadow);color:#e5e7eb;font-size:12px;line-height:1.35;}
    .gpu-popup h4{margin:0 0 6px 0;font-size:12px;font-weight:600;color:#e5e7eb}
    .gpu-popup .row{display:flex;justify-content:space-between;gap:16px}
    .gpu-popup .k{color:#cbd5e1}
    .gpu-popup .v{color:#e5e7eb}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>vLLM Latency — Llama 1B</h1>
      <a class="muted" href="./data/latency_history.json">raw JSON</a>
    </header>
    <p class="muted">
      Each point shows a <strong>distribution</strong> of per-iteration latencies for a run; an <em>Avg ms</em> line overlays the trend per batch size.
    </p>
    <div class="chart-wrap"><div id="chart"></div></div>

    <header style="margin-top:28px">
      <h1>GSM8K Accuracy — Llama 1B</h1>
      <a class="muted" href="./data/gsm8k_history.json">raw JSON</a>
    </header>
    <p class="muted">
      Exact-match accuracy per run, grouped by batch size (strict match shown; flexible extract in hover).
    </p>
    <div class="chart-wrap"><div id="gsm8kChart"></div></div>
  </div>

  <script>
    // ---------- Helpers ----------
    // Resolve CSS variables once so Plotly receives real colors
    const _css = getComputedStyle(document.documentElement);
    const cssVar = (name) => _css.getPropertyValue(name).trim();
    const theme = {
      bg: cssVar('--bg'),
      fg: cssVar('--fg'),
      axis: cssVar('--axis'),
      grid: cssVar('--grid')
    };
    const toMs = v => (v < 50 ? v * 1000 : v);
    const tsLabel = iso => {
      const d = new Date(iso);
      const p = n => String(n).padStart(2,'0');
      return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    };
    const paletteByBS = (bs) => ({
      1: '#22c55e', // green
      2: '#e9fa2d', // darker green
      4: '#1d4ed8', // blue
      8: '#ef4444', // red
    }[bs] || '#a3a3a3');

    // ---------- GPU helpers ----------
    const gpuCache = new Map(); // ts -> { rows, summary }
    function parseCsv(text){
      const lines = text.trim().split(/\r?\n/);
      if (!lines.length) return { rows: [], headers: [] };
      const headers = lines[0].split(',').map(s=>s.trim());
      const rows = [];
      for (let i=1;i<lines.length;i++){
        if (!lines[i].trim()) continue;
        const cols = lines[i].split(',');
        const obj = {};
        headers.forEach((h,idx)=>{ obj[h] = cols[idx] !== undefined ? cols[idx].trim() : '' });
        rows.push(obj);
      }
      return { rows, headers };
    }
    function summarizeGpu(rows){
      const num = (v)=>{ const n = Number(v); return Number.isFinite(n)? n : NaN; };
      const pick = (k)=> rows.map(r=>num(r[k])).filter(Number.isFinite);
      const stats = (arr)=>{
        if (!arr.length) return null;
        const n = arr.length;
        let s=0, mn=Infinity, mx=-Infinity;
        for (const v of arr){ s+=v; if (v<mn) mn=v; if (v>mx) mx=v; }
        return { avg: s/n, min: mn, max: mx };
      };
      return {
        temp: stats(pick('temperature.gpu')),
        util: stats(pick('utilization.gpu')),
        vramUsed: stats(pick('memory.used')),
        power: stats(pick('power.draw')),
      };
    }
    async function loadGpuSummary(ts){
      if (gpuCache.has(ts)) return gpuCache.get(ts);
      try{
        const r = await fetch(`./data/gpu_metrics/${ts}.csv`, {cache:'no-store'});
        if (!r.ok) throw new Error('not found');
        const text = await r.text();
        const { rows } = parseCsv(text);
        const summary = summarizeGpu(rows);
        const data = { rows, summary };
        gpuCache.set(ts, data);
        return data;
      }catch(err){
        const data = { rows: [], summary: null };
        gpuCache.set(ts, data);
        return data;
      }
    }
    function ensureGpuPopup(){
      let el = document.getElementById('gpu-popup');
      if (!el){
        el = document.createElement('div');
        el.id = 'gpu-popup';
        el.className = 'gpu-popup';
        el.style.display = 'none';
        document.body.appendChild(el);
      }
      return el;
    }
    function fmt(val, unit, digits=1){ return `${val.toFixed(digits)} ${unit}`; }
    function lastFinite(arr){ for (let i=arr.length-1;i>=0;i--){ if (Number.isFinite(arr[i])) return arr[i]; } return NaN; }
    function series(rows, key){ return rows.map(r=>Number(r[key])).map(v=>Number.isFinite(v)?v:NaN); }
    function sparkPath(values, width, height, pad=4){
      const vals = values.filter(v=>Number.isFinite(v));
      const n = values.length;
      if (!n) return '';
      const w = Math.max(1, width - pad*2);
      const h = Math.max(1, height - pad*2);
      let min = Infinity, max = -Infinity;
      for (const v of values){ if (Number.isFinite(v)){ if (v<min) min=v; if (v>max) max=v; } }
      if (!Number.isFinite(min) || !Number.isFinite(max)) { min = 0; max = 1; }
      const span = (max - min) || 1;
      const sx = n>1 ? w/(n-1) : 0;
      const sy = h/span;
      let d = '';
      for (let i=0;i<n;i++){
        const v = Number.isFinite(values[i]) ? values[i] : (i>0 ? values[i-1] : min);
        const x = pad + i*sx;
        const y = pad + (h - (v - min)*sy);
        d += (i===0?`M ${x.toFixed(2)} ${y.toFixed(2)}`:` L ${x.toFixed(2)} ${y.toFixed(2)}`);
      }
      return d;
    }
    function sparkBlock(label, values, color, unit, digits, w=260, h=36){
      if (!values || !values.length) return `<div class=\"row\"><span class=\"k\">${label}</span><span class=\"v\">—</span></div>`;
      let min=Infinity, max=-Infinity; for (const v of values){ if (Number.isFinite(v)){ if (v<min) min=v; if (v>max) max=v; } }
      const latest = lastFinite(values);
      const path = sparkPath(values, w, h, 4);
      const top = `<div class=\"row\"><span class=\"k\">${label}</span><span class=\"v\">${Number.isFinite(latest)?fmt(latest, unit, digits):'—'} (min ${Number.isFinite(min)?fmt(min, unit, digits):'—'}, max ${Number.isFinite(max)?fmt(max, unit, digits):'—'})</span></div>`;
      const svg = `<svg width=\"${w}\" height=\"${h}\" viewBox=\"0 0 ${w} ${h}\" style=\"display:block;margin-top:6px\"><path d=\"${path}\" fill=\"none\" stroke=\"${color}\" stroke-width=\"1.8\"/></svg>`;
      return `${top}${svg}`;
    }
    function renderGpuPopup(el, data, ts){
      const { rows, summary } = data || {};
      if (!summary){
        el.innerHTML = `<h4>GPU Metrics</h4><div class=\"row\"><span class=\"k\">ts</span><span class=\"v\">${ts}</span></div><div style=\"margin-top:4px;color:#94a3b8\">No GPU metrics file</div>`;
        return;
      }
      const utilS = series(rows, 'utilization.gpu');
      const tempS = series(rows, 'temperature.gpu');
      const vramS = series(rows, 'memory.used');
      const powerS = series(rows, 'power.draw');
      el.innerHTML = `
        <h4>GPU Metrics</h4>
        ${sparkBlock('Temp', tempS, '#f59e0b', '°C', 0)}
        ${sparkBlock('Util', utilS, '#60a5fa', '%', 0)}
        ${sparkBlock('VRAM used', vramS, '#22c55e', 'MiB', 0)}
        ${sparkBlock('Power', powerS, '#ef4444', 'W', 2)}
      `;
    }
    function attachGpuHover(gd, labelToTs){
      const popup = ensureGpuPopup();
      const offset = {x: 16, y: 16};
      gd.on('plotly_hover', async (d)=>{
        try{
          const lbl = d.points && d.points[0] && d.points[0].x;
          const ts = labelToTs.get(lbl);
          if (!ts) return;
          const data = await loadGpuSummary(ts);
          renderGpuPopup(popup, data, ts);
          const ev = d.event || window.event;
          const x = (ev && (ev.clientX || ev.pageX)) || 0;
          const y = (ev && (ev.clientY || ev.pageY)) || 0;
          popup.style.display = 'block';
          const w = popup.offsetWidth || 240;
          const left = Math.max(8, x - offset.x - w);
          popup.style.left = `${left}px`;
          popup.style.top  = `${y + offset.y}px`;
        }catch(e){
          // swallow
        }
      });
      gd.on('plotly_unhover', ()=>{ popup.style.display = 'none'; });
    }

    async function loadHist(){
      const r = await fetch('./data/latency_history.json', {cache:'no-store'});
      if (!r.ok) throw new Error('Failed to load latency_history.json');
      return await r.json();
    }

    async function loadGsm8k(){
      const r = await fetch('./data/gsm8k_history.json', {cache:'no-store'});
      if (!r.ok) throw new Error('Failed to load gsm8k_history.json');
      return await r.json();
    }

    function build(labelsOrdered, hist){
      const quantileSorted = (arr, q) => {
        const pos = (arr.length - 1) * q;
        const base = Math.floor(pos);
        const rest = pos - base;
        return arr[base + 1] !== undefined ? arr[base] + rest * (arr[base + 1] - arr[base]) : arr[base];
      };
      const statsFor = (vals) => {
        const a = [...vals].sort((x,y)=>x-y);
        const n = a.length;
        const min = a[0], max = a[n-1];
        const q1 = quantileSorted(a, 0.25);
        const med = quantileSorted(a, 0.50);
        const q3 = quantileSorted(a, 0.75);
        const avg = a.reduce((s,v)=>s+v,0)/Math.max(1,n);
        return { n, min, max, q1, med, q3, avg };
      };

      // Group runs by batch size
      const byBS = new Map();
      for (const r of hist) {
        const bs = r.batch_size;
        const lbl = tsLabel(r.ts);
        const lats = (r.metrics?.latencies || []).map(toMs);
        const avg  = toMs(r.metrics?.avg_latency ?? NaN);
        if (!byBS.has(bs)) byBS.set(bs, { x: [], y: [], xAvg: [], yAvg: [] });
        for (const v of lats){ byBS.get(bs).x.push(lbl); byBS.get(bs).y.push(v); }
        if (!Number.isNaN(avg)) { byBS.get(bs).xAvg.push(lbl); byBS.get(bs).yAvg.push(avg); }
      }

      const traces = [];
      for (const [bs, obj] of byBS.entries()){
        const color = paletteByBS(bs);

        // Box trace (thin line, no fill to match clean look)
        traces.push({
          type: 'box',
          name: `bs=${bs}`,
          x: obj.x,
          y: obj.y,
          boxpoints: 'outliers',
          line: {color, width:1.6},
          fillcolor: 'rgba(0,0,0,0)',
          marker: {color},
          offsetgroup: `g${bs}`,
          hoverinfo: 'skip',
          legendgroup: String(bs),
        });

        // Average line
        traces.push({
          type: 'scatter',
          mode: 'lines+markers',
          name: `Avg ms (bs=${bs})`,
          x: obj.xAvg,
          y: obj.yAvg,
          line: {color, width:2},
          marker: {color, size:5},
          hoverinfo: 'skip',
          legendgroup: String(bs),
        });

        // Invisible hover markers with consolidated stats
        const perLabel = new Map();
        for (let i=0;i<obj.x.length;i++){
          const lbl = obj.x[i]; const val = obj.y[i];
          if (!perLabel.has(lbl)) perLabel.set(lbl, []);
          perLabel.get(lbl).push(val);
        }
        const labels = Array.from(perLabel.keys()).sort();
        const hoverY = [];
        const custom = [];
        for (const lbl of labels){
          const s = statsFor(perLabel.get(lbl));
          hoverY.push(s.med);
          custom.push([s.n, s.avg, s.q1, s.med, s.q3, s.min, s.max]);
        }
        traces.push({
          type: 'scatter',
          mode: 'markers',
          name: `bs=${bs} (hover)`,
          x: labels,
          y: hoverY,
          customdata: custom,
          marker: { size: 8, opacity: 0 },
          hovertemplate:
            `bs=${bs}<br>%{x}`+
            '<br>n: %{customdata[0]}' +
            '<br>avg: %{customdata[1]:.1f} ms' +
            '<br>q1: %{customdata[2]:.1f} ms' +
            '<br>median: %{customdata[3]:.1f} ms' +
            '<br>q3: %{customdata[4]:.1f} ms' +
            '<br>min: %{customdata[5]:.1f} ms' +
            '<br>max: %{customdata[6]:.1f} ms<extra></extra>',
          showlegend: false,
          legendgroup: String(bs),
        });
      }

      // Categorical x in chronological order
      const categoryArray = Array.from(new Set(labelsOrdered)).sort();

      const layout = {
        margin: {l:70,r:110,t:10,b:64},
        font: {family:'DM Sans, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif', size:13, color: theme.fg},
        paper_bgcolor: theme.bg,
        plot_bgcolor: theme.bg,
        xaxis: {
          title: {text:'Run timestamp', font:{size:13, color: theme.axis}},
          type:'category',
          categoryorder:'array',
          categoryarray: categoryArray,
          tickangle:-20,
          tickfont:{color: theme.axis},
          gridcolor: theme.grid,
          zeroline:false,
        },
        yaxis: {
          title: {text:'Latency (ms)', font:{size:13, color: theme.axis}},
          tickfont:{color: theme.axis},
          gridcolor: theme.grid,
          zeroline:false,
        },
        legend: {
          orientation:'v', x:1.02, y:0.5, xanchor:'left', yanchor:'middle',
          font:{size:13, color: theme.fg},
          bgcolor:'rgba(0,0,0,0)',
          borderwidth:0,
          itemwidth: 50
        },
        boxmode: 'overlay',
        hovermode: 'closest',
        hoverlabel: {
          bgcolor:'#111827',
          bordercolor:'#374151',
          font:{family:'DM Sans, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif', size:12, color:'#e5e7eb'},
          namelength: -1
        }
      };
      return { traces, layout };
    }

    function buildGsm8k(labelsOrdered, hist){
      // Group results by batch size
      const byBS = new Map();
      for (const r of hist){
        const bs = r.batch_size;
        const lbl = tsLabel(r.ts);
        const res = r.metrics?.results?.gsm8k || {};
        const strict = res["exact_match,strict-match"];
        const flex = res["exact_match,flexible-extract"];
        if (!byBS.has(bs)) byBS.set(bs, { x: [], y: [], flex: [] });
        byBS.get(bs).x.push(lbl);
        byBS.get(bs).y.push(strict);
        byBS.get(bs).flex.push(flex);
      }

      const traces = [];
      for (const [bs, obj] of byBS.entries()){
        const color = paletteByBS(bs);
        // Visible line is strict-match EM; hover shows both
        traces.push({
          type: 'scatter',
          mode: 'lines+markers',
          name: `bs=${bs}`,
          x: obj.x,
          y: obj.y,
          line: {color, width:2},
          marker: {color, size:6},
          customdata: obj.flex,
          hovertemplate:
            `bs=${bs}<br>%{x}`+
            '<br>EM (strict): %{y:.1%}'+
            '<br>EM (flex): %{customdata:.1%}<extra></extra>',
          legendgroup: String(bs),
        });
      }

      const categoryArray = Array.from(new Set(labelsOrdered)).sort();
      const layout = {
        margin: {l:70,r:110,t:10,b:64},
        font: {family:'DM Sans, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif', size:13, color: theme.fg},
        paper_bgcolor: theme.bg,
        plot_bgcolor: theme.bg,
        xaxis: {
          title: {text:'Run timestamp', font:{size:13, color: theme.axis}},
          type:'category',
          categoryorder:'array',
          categoryarray: categoryArray,
          tickangle:-20,
          tickfont:{color: theme.axis},
          gridcolor: theme.grid,
          zeroline:false,
        },
        yaxis: {
          title: {text:'GSM8K EM', font:{size:13, color: theme.axis}},
          tickformat: '.0%',
          tickfont:{color: theme.axis},
          gridcolor: theme.grid,
          rangemode: 'tozero',
          zeroline:false,
        },
        legend: {
          orientation:'v', x:1.02, y:0.5, xanchor:'left', yanchor:'middle',
          font:{size:13, color: theme.fg},
          bgcolor:'rgba(0,0,0,0)',
          borderwidth:0,
          itemwidth: 50
        },
        hovermode: 'closest',
        hoverlabel: {
          bgcolor:'#111827',
          bordercolor:'#374151',
          font:{family:'DM Sans, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif', size:12, color:'#e5e7eb'},
          namelength: -1
        }
      };
      return { traces, layout };
    }

    // ---------- Run ----------
    (async ()=>{
      const [latHist, gsmHist] = await Promise.all([loadHist(), loadGsm8k()]);

      // Latency chart
      const labelOrder = latHist.map(r => tsLabel(r.ts));
      const { traces, layout } = build(labelOrder, latHist);
      Plotly.react(document.getElementById('chart'), traces, layout, {responsive:true, displayModeBar:false});
      // Attach GPU popup to latency chart
      const labelToTs = new Map();
      for (const r of latHist){ labelToTs.set(tsLabel(r.ts), r.ts); }
      attachGpuHover(document.getElementById('chart'), labelToTs);

      // GSM8K chart
      const gsmLabelOrder = gsmHist.map(r => tsLabel(r.ts));
      const { traces: gTraces, layout: gLayout } = buildGsm8k(gsmLabelOrder, gsmHist);
      Plotly.react(document.getElementById('gsm8kChart'), gTraces, gLayout, {responsive:true, displayModeBar:false});
      // Attach GPU popup to GSM8K chart as well
      const gsmLabelToTs = new Map();
      for (const r of gsmHist){ gsmLabelToTs.set(tsLabel(r.ts), r.ts); }
      attachGpuHover(document.getElementById('gsm8kChart'), gsmLabelToTs);
    })();
  </script>
</body>
</html>
