name: Self-hosted vLLM Latency

on:
  schedule:
    - cron: "45 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: vllm-latency
  cancel-in-progress: false

jobs:
  bench:
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      MODEL_ID: unsloth/Llama-3.2-1B-Instruct
      INPUT_LEN: 512
      OUTPUT_LEN: 128
      NUM_ITERS: 5
      NUM_WARMUP: 2
      BS_LIST: "1 2 4 8"
      GSM8K_FEWSHOT: "8"
      GSM8K_LIMIT: "100"
      PAGES_BRANCH: gh-pages

    steps:
      - uses: actions/checkout@v4

      - name: Ensure system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y jq python3-venv

      - name: Python venv + deps (cached)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.bench.txt'
        
      - name: Create venv and install requirements (+ lm-eval)
        run: |
          python -m venv ~/.venvs/vllm
          source ~/.venvs/vllm/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.bench.txt
          # New: lm-eval harness
          pip install 'lm-eval>=0.4.0,<0.5'

      - name: Record GPU + env
        run: |
          mkdir -p results
          nvidia-smi --query-gpu=name,memory.total,driver_version --format=csv,noheader | tee results/gpu.txt
          python - <<'PY'
          import json, platform, sys, importlib
          info={"python":sys.version.split()[0],"torch":None,"vllm":None,"platform":platform.platform()}
          for m in ("torch","vllm"):
              try: info[m]=importlib.import_module(m).__version__
              except Exception: pass
          open("results/env.json","w").write(json.dumps(info, indent=2))
          PY

      - name: Capture config outputs
        id: cfg
        run: |
          echo "model_id=$MODEL_ID" >> "$GITHUB_OUTPUT"
          echo "input_len=$INPUT_LEN" >> "$GITHUB_OUTPUT"
          echo "output_len=$OUTPUT_LEN" >> "$GITHUB_OUTPUT"
          echo "bs_list=$BS_LIST" >> "$GITHUB_OUTPUT"

      - name: Count GPUs
        id: gpu_config
        run: |
          echo "gpu_count=$(nvidia-smi -L | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Run latency bench (local)
        env:
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          source ~/.venvs/vllm/bin/activate
          for B in ${BS_LIST}; do
            echo "==> bench bs=${B}"
            vllm bench latency \
              --model "${MODEL_ID}" \
              --batch-size "${B}" \
              --input-len "${INPUT_LEN}" \
              --output-len "${OUTPUT_LEN}" \
              --num-iters "${NUM_ITERS}" \
              --num-iters-warmup "${NUM_WARMUP}" \
              --output-json "results/latency_bs${B}.json" | tee "results/latency_bs${B}.log"
          done

      - name: Run GSM8K eval (lm-eval via vLLM)
        env:
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          source ~/.venvs/vllm/bin/activate
          MAXLEN=$(( INPUT_LEN + OUTPUT_LEN + 64 ))
          for B in ${BS_LIST}; do
            echo "==> gsm8k bs=${B}"
            python -m lm_eval \
              --model vllm \
              --model_args pretrained="${MODEL_ID}",dtype=auto,gpu_memory_utilization=0.9,max_model_len=${MAXLEN},trust_remote_code=True \
              --tasks gsm8k \
              --num_fewshot "${GSM8K_FEWSHOT}" \
              --limit "${GSM8K_LIMIT}" \
              --batch_size "${B}" \
              --output_path "results/gsm8k_bs${B}" \
              --log_samples | tee "results/gsm8k_bs${B}.log"
          done

      - name: Upload artifacts (JSON + logs + env)
        uses: actions/upload-artifact@v4
        with:
          name: vllm-latency-${{ github.run_id }}
          path: |
            results/latency_bs*.json
            results/latency_bs*.log
            results/gsm8k_bs*/**/results_*.json
            results/gsm8k_bs*.log
            results/env.json
            results/gpu.txt
          if-no-files-found: error

      - name: Add markdown table to Job Summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, json, os, re

          def to_ms(x):
              return (x*1000.0 if isinstance(x,(int,float)) and x < 50 else x)

          # ---------- Latency table ----------
          files = sorted(glob.glob("results/latency_bs*.json"))
          rows = []
          for f in files:
              d = json.load(open(f))
              m = re.search(r'bs(\d+)', os.path.basename(f))
              if not m: 
                  continue
              bs = int(m.group(1))
              avg = to_ms(d.get("avg_latency"))
              p = d.get("percentiles", {}) or {}
              rows.append((bs, avg, *(to_ms(p.get(k)) for k in ("10","25","50","75","90","99"))))

          print("## vLLM Latency — Llama 1B\n")
          print("| Batch | Avg (ms) | P10 | P25 | P50 | P75 | P90 | P99 |")
          print("|---:|---:|---:|---:|---:|---:|---:|---:|")
          for bs,avg,p10,p25,p50,p75,p90,p99 in sorted(rows):
              fm = lambda x: ("" if x is None else f"{x:.1f}")
              print(f"| {bs} | {fm(avg)} | {fm(p10)} | {fm(p25)} | {fm(p50)} | {fm(p75)} | {fm(p90)} | {fm(p99)} |")

          # ---------- GSM8K (lm-eval) ----------
          # v0.4.x writes results under: results/gsm8k_bsX/<sanitized_model>/results_*.json
          paths = sorted(glob.glob("results/gsm8k_bs*/**/results_*.json", recursive=True))

          # Fallback to older/flat naming if present:
          if not paths:
              for ddir in sorted(glob.glob("results/gsm8k_bs*")):
                  cand = [os.path.join(ddir, n) for n in ("eval_results.json","results.json","metrics.json")]
                  paths.extend([p for p in cand if os.path.exists(p)])

          # Keep latest (by mtime) per batch size
          by_bs = {}
          for p in paths:
              m = re.search(r"gsm8k_bs(\d+)", p)
              if not m:
                  continue
              bs = int(m.group(1))
              mt = os.path.getmtime(p)
              if (bs not in by_bs) or (mt > by_bs[bs][0]):
                  by_bs[bs] = (mt, p)

          def extract_scores(d):
              # Get the gsm8k metrics dict across formats
              res = d.get("results", {})
              if isinstance(res, dict) and "gsm8k" in res and isinstance(res["gsm8k"], dict):
                  g = res["gsm8k"]
              elif isinstance(res, dict):
                  g = res  # older single-task dumps
              else:
                  g = {}

              # Prefer explicit strict/flex if present; fall back to plain exact_match/acc
              strict = g.get("exact_match,strict-match") or g.get("exact_match_strict") or g.get("em_strict")
              flex   = g.get("exact_match,flexible-extract") or g.get("exact_match") or g.get("acc")

              # Effective sample count if available
              n_eff = None
              ns = d.get("n-samples") or d.get("n_samples")
              if isinstance(ns, dict):
                  ge = ns.get("gsm8k")
                  if isinstance(ge, dict):
                      n_eff = ge.get("effective") or ge.get("n_effective") or ge.get("n")
              return strict, flex, n_eff

          if by_bs:
              print("\n## GSM8K (lm-eval)\n")
              print("| Batch | EM (strict) | EM (flex) | n(eff) |")
              print("|---:|---:|---:|---:|")
              for bs, (_, p) in sorted(by_bs.items()):
                  d = json.load(open(p))
                  strict, flex, n_eff = extract_scores(d)
                  fmt = lambda x: "" if x is None else (f"{x:.4f}" if isinstance(x,(int,float)) else str(x))
                  print(f"| {bs} | {fmt(strict)} | {fmt(flex)} | {fmt(n_eff)} |")
          else:
              print("\n_**No gsm8k JSON results found**_\n")
          PY

      - name: Update GitHub Pages data only
        run: |
          set -euo pipefail
          cp -r results _results_tmp
          git fetch origin $PAGES_BRANCH || true
          if git show-ref --verify --quiet refs/heads/$PAGES_BRANCH; then
            git switch $PAGES_BRANCH
          elif git show-ref --verify --quiet refs/remotes/origin/$PAGES_BRANCH; then
            git switch --create $PAGES_BRANCH origin/$PAGES_BRANCH
          else
            git switch --orphan $PAGES_BRANCH
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p docs/data
          [ -f docs/data/latency_history.json ] || echo "[]" > docs/data/latency_history.json
          # New: initialize gsm8k history file
          [ -f docs/data/gsm8k_history.json ] || echo "[]" > docs/data/gsm8k_history.json

          cp -r _results_tmp results
          
          python - <<'PY'
          import glob, json, os, time, re

          ts = int(time.time()*1000)
          hist_path = "docs/data/latency_history.json"
          gsm_path  = "docs/data/gsm8k_history.json"

          # Load existing histories (files already created in the shell before this block)
          hist = json.load(open(hist_path))
          gsm  = json.load(open(gsm_path))
          meta = json.load(open("results/env.json"))
          gpu = open("results/gpu.txt").read().strip() if os.path.exists("results/gpu.txt") else ""

          # ---- Latency history (JSON files) ----
          for f in sorted(glob.glob("results/latency_bs*.json")):
              d = json.load(open(f))
              d.setdefault("percentiles", {})
              m = re.search(r'bs(\d+)', os.path.basename(f))
              if not m:
                  continue
              bs = int(m.group(1))
              hist.append({"ts": ts, "batch_size": bs, "metrics": d, "meta": meta, "gpu": gpu})

          # ---- GSM8K history (directories only) ----
          for ddir in sorted(glob.glob("results/gsm8k_bs*")):
              if not os.path.isdir(ddir):
                  continue  # skip .log files like gsm8k_bs1.log
              # normalize and extract trailing bs number (e.g., gsm8k_bs8)
              base = os.path.basename(os.path.normpath(ddir))
              m = re.search(r'bs(\d+)$', base)
              if not m:
                  continue
              bs = int(m.group(1))

              # find a result file we can read
              for rpath in sorted(glob.glob("results/gsm8k_bs*/**/results_*.json", recursive=True)):
                m = re.search(r"gsm8k_bs(\d+)", rpath)
                if not m: 
                    continue
                bs = int(m.group(1))
                d  = json.load(open(rpath))
                gsm.append({"ts": ts, "batch_size": bs, "metrics": d, "meta": meta, "gpu": gpu})

          open(hist_path, "w").write(json.dumps(hist, indent=2))
          open(gsm_path,  "w").write(json.dumps(gsm,  indent=2))
          PY

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git commit -m "bench: append latency + gsm8k data [skip ci]" || echo "No data changes"
          git push origin $PAGES_BRANCH

      - name: Notify Slack (success/failure)
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          GPU_COUNT: ${{ steps.gpu_config.outputs.gpu_count }}
          MODEL_ID_RES:   ${{ steps.cfg.outputs.model_id }}
          INPUT_LEN_RES:  ${{ steps.cfg.outputs.input_len }}
          OUTPUT_LEN_RES: ${{ steps.cfg.outputs.output_len }}
          BS_LIST_RES:    ${{ steps.cfg.outputs.bs_list }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$JOB_STATUS" = "success" ]; then
            EMOJI=":white_check_mark:"; COLOR="#2eb886"
          elif [ "$JOB_STATUS" = "cancelled" ]; then
            EMOJI=":warning:"; COLOR="#daa038"
          else
            EMOJI=":x:"; COLOR="#e01e5a"
          fi

          TITLE="$EMOJI vLLM Latency — (GPUx${GPU_COUNT}) — ${JOB_STATUS^^}"
          SUB="Repo \`${{ github.repository }}\` • Branch \`${BRANCH}\` • Commit \`${SHA:0:7}\`"
          CFG="Model \`${MODEL_ID_RES}\` • BS \`${BS_LIST_RES}\` • In ${INPUT_LEN_RES} / Out ${OUTPUT_LEN_RES} • iters ${NUM_ITERS} (warmup ${NUM_WARMUP})"

          payload=$(jq -n \
            --arg title "$TITLE" \
            --arg sub "$SUB" \
            --arg cfg "$CFG" \
            --arg run "$RUN_URL" \
            --arg color "$COLOR" '
            {
              attachments: [
                {
                  color: $color,
                  blocks: [
                    { "type": "section", "text": { "type": "mrkdwn", "text": $title } },
                    { "type": "context", "elements": [ { "type": "mrkdwn", "text": $sub } ] },
                    { "type": "context", "elements": [ { "type": "mrkdwn", "text": $cfg } ] },
                    { "type": "actions", "elements": [
                      { "type": "button", "text": { "type": "plain_text", "text": "View GitHub Run" }, "url": $run }
                    ]}
                  ]
                }
              ]
            }')

          curl -fsS -X POST -H 'Content-Type: application/json' \
            --data "$payload" \
            "$SLACK_WEBHOOK_URL" || echo "Slack notify failed (continuing)"