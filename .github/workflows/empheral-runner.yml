name: Self-hosted vLLM Latency

on:
  schedule:
    - cron: "45 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: vllm-latency
  cancel-in-progress: false

jobs:
  bench:
    runs-on: self-hosted
    timeout-minutes: 40
    env:
      MODEL_ID: unsloth/Llama-3.2-1B-Instruct
      INPUT_LEN: 512
      OUTPUT_LEN: 128
      NUM_ITERS: 40
      NUM_WARMUP: 10
      BS_LIST: "2 4 8"
      GSM8K_FEWSHOT: "8"
      GSM8K_LIMIT: "800"
      PAGES_BRANCH: gh-pages

    steps:
      - uses: actions/checkout@v4

      - name: Ensure system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y jq python3-venv sysstat

      - name: Python venv + deps (cached)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.bench.txt'
        
      - name: Create venv and install requirements (+ lm-eval)
        run: |
          python -m venv ~/.venvs/vllm
          source ~/.venvs/vllm/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.bench.txt
          # New: lm-eval harness
          pip install 'lm-eval>=0.4.0,<0.5'

      - name: Record GPU + env
        run: |
          set -euo pipefail
          mkdir -p results

          # GPU quick summary (human-readable)
          if command -v nvidia-smi >/dev/null 2>&1; then
            nvidia-smi --query-gpu=name,memory.total,driver_version --format=csv,noheader | tee results/gpu.txt
          else
            echo "nvidia-smi not found" | tee results/gpu.txt
          fi

          # Use the same Python env as the bench to capture correct package versions
          source ~/.venvs/vllm/bin/activate
          python scripts/record_metrics.py


      - name: Capture config outputs
        id: cfg
        run: |
          echo "model_id=$MODEL_ID" >> "$GITHUB_OUTPUT"
          echo "input_len=$INPUT_LEN" >> "$GITHUB_OUTPUT"
          echo "output_len=$OUTPUT_LEN" >> "$GITHUB_OUTPUT"
          echo "bs_list=$BS_LIST" >> "$GITHUB_OUTPUT"

      - name: Count GPUs
        id: gpu_config
        run: |
          echo "gpu_count=$(nvidia-smi -L | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Run latency bench (local)
        env:
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          source ~/.venvs/vllm/bin/activate
          
          # Start lightweight GPU/CPU monitoring while the bench runs
          mkdir -p results/metrics
          
          # GPU time-series (1s cadence) — CSV with unix timestamp prefix
          if command -v nvidia-smi >/dev/null 2>&1; then
            Q="index,name,uuid,compute_cap,driver_version,temperature.gpu,utilization.gpu,utilization.memory,memory.total,memory.used,memory.free,clocks.sm,clocks.mem,power.draw,power.limit"
            echo "ts_unix,${Q}" > results/metrics/gpu_timeseries.csv
            (
              while true; do
                TS=$(date +%s)
                nvidia-smi --query-gpu="${Q}" --format=csv,noheader,nounits | sed -e "s/^/${TS},/"
                sleep 1
              done
            ) >> results/metrics/gpu_timeseries.csv 2>/dev/null &
            echo $! > results/metrics/gpu_mon.pid
          fi

          # Ensure monitors are stopped on exit
          cleanup_monitors() {
            for f in results/metrics/*_mon.pid; do
              [ -f "$f" ] && kill "$(cat "$f")" 2>/dev/null || true
            done
          }
          trap cleanup_monitors EXIT
          for B in ${BS_LIST}; do
            echo "==> bench bs=${B}"
            vllm bench latency \
              --model "${MODEL_ID}" \
              --batch-size "${B}" \
              --input-len "${INPUT_LEN}" \
              --output-len "${OUTPUT_LEN}" \
              --num-iters "${NUM_ITERS}" \
              --num-iters-warmup "${NUM_WARMUP}" \
              --output-json "results/latency_bs${B}.json" | tee "results/latency_bs${B}.log"
          done

          # Stop monitors explicitly (trap also handles errors)
          cleanup_monitors

      - name: Run GSM8K eval (lm-eval via vLLM)
        env:
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          source ~/.venvs/vllm/bin/activate
          MAXLEN=$(( INPUT_LEN + OUTPUT_LEN + 64 ))
          
          # Start lightweight GPU/CPU monitoring while GSM8K runs
          mkdir -p results/metrics

          if command -v nvidia-smi >/dev/null 2>&1; then
            Q="index,name,uuid,compute_cap,driver_version,temperature.gpu,utilization.gpu,utilization.memory,memory.total,memory.used,memory.free,clocks.sm,clocks.mem,power.draw,power.limit"
            [ -f results/metrics/gpu_timeseries.csv ] || echo "ts_unix,${Q}" > results/metrics/gpu_timeseries.csv
            (
              while true; do
                TS=$(date +%s)
                nvidia-smi --query-gpu="${Q}" --format=csv,noheader,nounits | sed -e "s/^/${TS},/"
                sleep 1
              done
            ) >> results/metrics/gpu_timeseries.csv 2>/dev/null &
            echo $! > results/metrics/gpu_mon_gsm.pid
          fi

          if command -v mpstat >/dev/null 2>&1; then
            mpstat -P ALL 1 > results/metrics/cpu_mpstat_gsm.log 2>&1 &
            echo $! > results/metrics/cpu_mon_gsm.pid
            sleep 1
          fi

          cleanup_monitors() {
            for f in results/metrics/*_mon_gsm.pid; do
              [ -f "$f" ] && kill "$(cat "$f")" 2>/dev/null || true
            done
          }
          trap cleanup_monitors EXIT
          for B in ${BS_LIST}; do
            echo "==> gsm8k bs=${B}"
            python -m lm_eval \
              --model vllm \
              --model_args pretrained="${MODEL_ID}",dtype=auto,gpu_memory_utilization=0.9,max_model_len=${MAXLEN},trust_remote_code=True \
              --tasks gsm8k \
              --num_fewshot "${GSM8K_FEWSHOT}" \
              --limit "${GSM8K_LIMIT}" \
              --batch_size "${B}" \
              --output_path "results/gsm8k_bs${B}" \
              --log_samples | tee "results/gsm8k_bs${B}.log"
          done

          cleanup_monitors

      - name: Upload artifacts (JSON + logs + env)
        uses: actions/upload-artifact@v4
        with:
          name: vllm-latency-${{ github.run_id }}
          path: |
            results/latency_bs*.json
            results/latency_bs*.log
            results/gsm8k_bs*/**/results_*.json
            results/gsm8k_bs*.log
            results/env.json
            results/gpu.txt
            results/gpu.json
            results/cpu.json
            results/metrics/gpu_timeseries.csv
            results/metrics/cpu_mpstat_gsm.log
          if-no-files-found: error

      - name: Add markdown table to Job Summary
        shell: bash
        run: |
          python scripts/collect_results.py summary --results-dir results --out "$GITHUB_STEP_SUMMARY"

      - name: Update GitHub Pages data only
        run: |
          set -euo pipefail
          cp -r results _results_tmp
          git fetch origin $PAGES_BRANCH || true
          if git show-ref --verify --quiet refs/heads/$PAGES_BRANCH; then
            git switch $PAGES_BRANCH
          elif git show-ref --verify --quiet refs/remotes/origin/$PAGES_BRANCH; then
            git switch --create $PAGES_BRANCH origin/$PAGES_BRANCH
          else
            git switch --orphan $PAGES_BRANCH
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p docs/data
          [ -f docs/data/latency_history.json ] || echo "[]" > docs/data/latency_history.json
          # New: initialize gsm8k history file
          [ -f docs/data/gsm8k_history.json ] || echo "[]" > docs/data/gsm8k_history.json

          cp -r _results_tmp results
          
          python scripts/collect_results.py append-history \
            --results-dir results \
            --hist-path docs/data/latency_history.json \
            --gsm-path  docs/data/gsm8k_history.json

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git commit -m "bench: append latency + gsm8k data [skip ci]" || echo "No data changes"
          git push origin $PAGES_BRANCH

      - name: Notify Slack (success/failure)
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          GPU_COUNT: ${{ steps.gpu_config.outputs.gpu_count }}
          MODEL_ID_RES:   ${{ steps.cfg.outputs.model_id }}
          INPUT_LEN_RES:  ${{ steps.cfg.outputs.input_len }}
          OUTPUT_LEN_RES: ${{ steps.cfg.outputs.output_len }}
          BS_LIST_RES:    ${{ steps.cfg.outputs.bs_list }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$JOB_STATUS" = "success" ]; then
            EMOJI=":white_check_mark:"; COLOR="#2eb886"
          elif [ "$JOB_STATUS" = "cancelled" ]; then
            EMOJI=":warning:"; COLOR="#daa038"
          else
            EMOJI=":x:"; COLOR="#e01e5a"
          fi

          TITLE="$EMOJI vLLM Latency — (GPUx${GPU_COUNT}) — ${JOB_STATUS^^}"
          SUB="Repo \`${{ github.repository }}\` • Branch \`${BRANCH}\` • Commit \`${SHA:0:7}\`"
          CFG="Model \`${MODEL_ID_RES}\` • BS \`${BS_LIST_RES}\` • In ${INPUT_LEN_RES} / Out ${OUTPUT_LEN_RES} • iters ${NUM_ITERS} (warmup ${NUM_WARMUP})"

          payload=$(jq -n \
            --arg title "$TITLE" \
            --arg sub "$SUB" \
            --arg cfg "$CFG" \
            --arg run "$RUN_URL" \
            --arg color "$COLOR" '
            {
              attachments: [
                {
                  color: $color,
                  blocks: [
                    { "type": "section", "text": { "type": "mrkdwn", "text": $title } },
                    { "type": "context", "elements": [ { "type": "mrkdwn", "text": $sub } ] },
                    { "type": "context", "elements": [ { "type": "mrkdwn", "text": $cfg } ] },
                    { "type": "actions", "elements": [
                      { "type": "button", "text": { "type": "plain_text", "text": "View GitHub Run" }, "url": $run }
                    ]}
                  ]
                }
              ]
            }')

          curl -fsS -X POST -H 'Content-Type: application/json' \
            --data "$payload" \
            "$SLACK_WEBHOOK_URL" || echo "Slack notify failed (continuing)"
