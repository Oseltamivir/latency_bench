name: vLLM Manual Bench (Dispatcher)

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: "HF model id to benchmark"
        required: true
        type: string
        default: "unsloth/Llama-3.2-1B-Instruct"
      input_len:
        description: "Input sequence length (tokens)"
        required: true
        type: number
        default: 512
      output_len:
        description: "Output sequence length (tokens)"
        required: true
        type: number
        default: 128
      min_bs:
        description: "Minimum batch size"
        required: true
        type: number
        default: 1
      max_bs:
        description: "Maximum batch size"
        required: true
        type: number
        default: 8

jobs:
  run-latency-bench:
    # Call the reusable workflow in this repo
    uses: ./.github/workflows/vllm-latency.yml
    with:
      model_id:  ${{ inputs.model_id }}
      input_len: ${{ inputs.input_len }}
      output_len: ${{ inputs.output_len }}
      min_bs:    ${{ inputs.min_bs }}
      max_bs:    ${{ inputs.max_bs }}
    # Pass all secrets through to the called workflow
    secrets: inherit
    # The called workflow needs to commit to gh-pages; grant least-privilege at the job level
    permissions:
      contents: write
      actions: read