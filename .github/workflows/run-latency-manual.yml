name: vLLM Manual Bench (Dispatcher)

on:
  workflow_dispatch:
    inputs:
      model_id:   { description: "HF model id", required: true,  type: string, default: "unsloth/Llama-3.2-1B-Instruct" }
      input_len:  { description: "Input tokens", required: true,  type: string, default: "512" }
      output_len: { description: "Output tokens", required: true,  type: string, default: "128" }
      min_bs:     { description: "Min batch size", required: true, type: string, default: "1" }
      max_bs:     { description: "Max batch size", required: true, type: string, default: "8" }

jobs:
  run-latency-bench:
    # Pin to a ref that contains the callable workflow
    uses: ./.github/workflows/vllm-latency.yml@v1
    with:
      model_id:   ${{ inputs.model_id }}
      input_len:  ${{ inputs.input_len }}
      output_len: ${{ inputs.output_len }}
      min_bs:     ${{ inputs.min_bs }}
      max_bs:     ${{ inputs.max_bs }}
    secrets: inherit
    permissions:
      actions: read
      contents: write
    # If your secrets live in an Environment, uncomment:
    # environment: production