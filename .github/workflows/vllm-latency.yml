name: vLLM Llama 8B Latency (TP2)

on:
  schedule:
    - cron: "0 * * * *" # hourly (UTC)
  workflow_dispatch:

permissions:
  contents: write  # to commit docs/ chart + history

concurrency:
  group: vllm-latency
  cancel-in-progress: false

jobs:
  bench:
    # Orchestrates a remote Lambda Cloud GPU instance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODEL_ID: meta-llama/Llama-3.1-8B-Instruct
      TP_SIZE: 2
      INPUT_LEN: 512
      OUTPUT_LEN: 128
      NUM_ITERS: 5
      NUM_WARMUP: 2
      CUDA_VISIBLE_DEVICES: 0,1
      # Batch sizes to run on the remote instance (replaces the matrix)
      BS_LIST: "1 2 4 8"

      # Lambda Cloud API configuration (set repo Variables where possible)
      LL_API_URL: https://cloud.lambdalabs.com/api/v1
      LL_REGION: ${{ vars.LL_REGION }}            # e.g. us-south-1
      LL_INSTANCE_TYPE: ${{ vars.LL_INSTANCE_TYPE }}  # e.g. gpu_2x_a10 or gpu_1x_a6000
      LL_SSH_KEY_NAME: ${{ vars.LL_SSH_KEY_NAME }}    # name of an SSH key already uploaded to Lambda Cloud

    steps:
      - uses: actions/checkout@v4

      - name: Ensure results dir
        run: mkdir -p results
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      
      - name: Determine GPU configuration
        id: gpu_config
        shell: bash
        run: |
          # Extract GPU count from instance type (e.g., gpu_2x_a10 -> 2, gpu_1x_a6000 -> 1)
          GPU_COUNT=$(echo "$LL_INSTANCE_TYPE" | grep -oP '\d+(?=x)' || echo "1")
          echo "gpu_count=$GPU_COUNT" | tee -a "$GITHUB_OUTPUT"
          
          if [[ "$GPU_COUNT" == "1" ]]; then
            echo "tp_size=1" | tee -a "$GITHUB_OUTPUT"
            echo "cuda_devices=0" | tee -a "$GITHUB_OUTPUT"
          else
            echo "tp_size=$TP_SIZE" | tee -a "$GITHUB_OUTPUT"
            echo "cuda_devices=$CUDA_VISIBLE_DEVICES" | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Launch Lambda Cloud instance
        id: launch
        env:
          LAMBDA_API_KEY: ${{ secrets.LAMBDA_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${LL_REGION:-}" || -z "${LL_INSTANCE_TYPE:-}" || -z "${LL_SSH_KEY_NAME:-}" ]]; then
            echo "LL_REGION, LL_INSTANCE_TYPE, and LL_SSH_KEY_NAME must be set via repository Variables." >&2
            exit 1
          fi
          if [[ -z "${LAMBDA_API_KEY:-}" ]]; then
            echo "secrets.LAMBDA_API_KEY must be set." >&2
            exit 1
          fi

          # Create instance (1x) with the specified SSH key using the correct endpoint
          CREATE_RESP=$(curl -fsS -X POST \
            -H "Authorization: Bearer ${LAMBDA_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg region "$LL_REGION" --arg type "$LL_INSTANCE_TYPE" --arg key "$LL_SSH_KEY_NAME" '{region_name:$region, instance_type_name:$type, ssh_key_names:[$key], quantity:1}')" \
            "$LL_API_URL/instance-operations/launch")
          echo "$CREATE_RESP" > create_instance.json

          # Try common response shapes to find the instance ID
          INSTANCE_ID=$(jq -r '(.data.instance_ids[0] // .instance_ids[0] // .data.instances[0].id // .data[0].id // .instances[0].id // empty)' create_instance.json)
          if [[ -z "$INSTANCE_ID" || "$INSTANCE_ID" == "null" ]]; then
            echo "Failed to parse instance ID from API response:" >&2
            cat create_instance.json >&2
            exit 1
          fi
          echo "instance_id=$INSTANCE_ID" | tee -a "$GITHUB_OUTPUT"

      - name: Wait for instance to be running and get IP
        id: wait
        env:
          LAMBDA_API_KEY: ${{ secrets.LAMBDA_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          ID=${{ steps.launch.outputs.instance_id }}
          for i in {1..60}; do
            RESP=$(curl -fsS -H "Authorization: Bearer ${LAMBDA_API_KEY}" "$LL_API_URL/instances/$ID" || true)
            echo "$RESP" > instance_${ID}.json
            STATE=$(jq -r '(.data.status // .data.instance.status // .data.instance.state // .status // "")' instance_${ID}.json)
            IP=$(jq -r '(.data.ip // .data.instance.ip // .data.instance.network.ip_addresses[0].ip_address // .data.instance.ip_address // .data.ip_address // .data.instance.public_ip // "")' instance_${ID}.json)
            echo "state=$STATE ip=$IP"
            if [[ "$STATE" == "running" || "$STATE" == "active" ]] && [[ -n "$IP" && "$IP" != "null" ]]; then
              echo "instance_ip=$IP" | tee -a "$GITHUB_OUTPUT"
              break
            fi
            sleep 10
          done
          if [[ -z "${IP:-}" || "$IP" == "null" ]]; then
            echo "Timed out waiting for instance IP" >&2
            exit 1
          fi

      - name: Install SSH key
        id: sshkey
        env:
          LL_SSH_PRIVATE_KEY: ${{ secrets.LL_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${LL_SSH_PRIVATE_KEY:-}" ]]; then
            echo "secrets.LL_SSH_PRIVATE_KEY must contain the private key matching LL_SSH_KEY_NAME." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$LL_SSH_PRIVATE_KEY" > ~/.ssh/lambda_key
          chmod 600 ~/.ssh/lambda_key
          # Pre-populate known_hosts to avoid StrictHostKey prompt
          ssh-keyscan -H ${{ steps.wait.outputs.instance_ip }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Run latency bench on Lambda instance
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ACTUAL_TP_SIZE: ${{ steps.gpu_config.outputs.tp_size }}
          ACTUAL_CUDA_DEVICES: ${{ steps.gpu_config.outputs.cuda_devices }}
        shell: bash
        run: |
          set -euo pipefail
          REMOTE=ubuntu@${{ steps.wait.outputs.instance_ip }}
          # Send a one-shot script to the instance and execute it
          ssh -i ~/.ssh/lambda_key -o StrictHostKeyChecking=no "$REMOTE" bash -s <<REMOTE_SCRIPT
          set -euo pipefail
          mkdir -p ~/results
          # Ensure Python and pip are ready; Lambda Cloud images ship with Python 3.10 on Ubuntu 22.04
          python3 -m pip install --upgrade pip
          python3 -m pip install "vllm[bench]>=0.10.0" hf_transfer

          # Capture env (GPU, Torch, vLLM) on the remote machine
          nvidia-smi --query-gpu=name,memory.total,driver_version --format=csv,noheader > ~/results/gpu.txt || true
          python3 - <<'PY'
          import json, platform, sys, importlib
          info = {
            "python": sys.version.split()[0],
            "torch": None,
            "vllm": None,
            "platform": platform.platform(),
          }
          try:
            info["torch"] = importlib.import_module("torch").__version__
          except Exception:
            pass
          try:
            info["vllm"] = importlib.import_module("vllm").__version__
          except Exception:
            pass
          open("/home/ubuntu/results/env.json","w").write(json.dumps(info, indent=2))
          PY

          export HUGGING_FACE_HUB_TOKEN='${HF_TOKEN}'
          export CUDA_VISIBLE_DEVICES='${ACTUAL_CUDA_DEVICES}'

          for B in ${BS_LIST}; do
            vllm bench latency \
              --model "${MODEL_ID}" \
              --tensor-parallel-size "${ACTUAL_TP_SIZE}" \
              --batch-size "$B" \
              --input-len "${INPUT_LEN}" \
              --output-len "${OUTPUT_LEN}" \
              --num-iters "${NUM_ITERS}" \
              --num-iters-warmup "${NUM_WARMUP}" \
              --disable-detokenize \
              --output-json "/home/ubuntu/results/latency_bs${B}.json"
          done
          REMOTE_SCRIPT

      - name: Download results from instance
        shell: bash
        run: |
          set -euo pipefail
          REMOTE=ubuntu@${{ steps.wait.outputs.instance_ip }}
          scp -i ~/.ssh/lambda_key -o StrictHostKeyChecking=no -r "$REMOTE:results/" ./

      - name: Terminate Lambda Cloud instance
        if: always()
        env:
          LAMBDA_API_KEY: ${{ secrets.LAMBDA_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          ID=${{ steps.launch.outputs.instance_id }}
          # Attempt termination; ignore failures to avoid masking prior errors
          curl -fsS -X POST -H "Authorization: Bearer ${LAMBDA_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"instance_ids\":[\"$ID\"]}" \
            "$LL_API_URL/instance-operations/terminate" || true

      - name: Upload artifacts (raw JSON + env)
        uses: actions/upload-artifact@v4
        with:
          name: vllm-latency-${{ github.run_id }}
          path: results/**

      - name: Add markdown table to Job Summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, json, os
          files = sorted(glob.glob("results/latency_bs*.json"))
          # Collect rows
          rows=[]
          for f in files:
            d=json.load(open(f))
            bs=int(os.path.basename(f).split("bs")[1].split(".")[0])
            # The CLI emits avg + percentiles; seconds vs ms can vary—normalize to ms if needed.
            def get(*c):
              for k in c:
                if k in d: return d[k]
              return None
            avg = get("avg_latency","avg_latency_s","avg_latency_seconds")
            p50 = get("p50_latency","p50_latency_s","p50")
            p95 = get("p95_latency","p95_latency_s","p95")
            to_ms=lambda x: (x*1000.0 if x is not None and x<50 else x)  # crude: if value looks like seconds, convert
            rows.append((bs, to_ms(avg), to_ms(p50), to_ms(p95)))
          print("## vLLM Latency — Llama 8B (TP=${{ steps.gpu_config.outputs.tp_size }})")
          print()
          print("| Batch | Avg (ms) | P50 (ms) | P95 (ms) |")
          print("|---:|---:|---:|---:|")
          for (bs,avg,p50,p95) in rows:
            fm=lambda x: ("" if x is None else f"{x:.1f}")
            print(f"| {bs} | {fm(avg)} | {fm(p50)} | {fm(p95)} |")
          PY

      - name: Update GitHub Pages data & chart
        run: |
          mkdir -p docs/data
          # init history file if it doesn't exist
          [ -f docs/data/latency_history.json ] || echo "[]" > docs/data/latency_history.json

          python - <<'PY'
          import glob, json, os, time
          ts=int(time.time()*1000)
          hist_path="docs/data/latency_history.json"
          hist=json.load(open(hist_path))
          meta=json.load(open("results/env.json"))
          gpu=open("results/gpu.txt").read().strip() if os.path.exists("results/gpu.txt") else ""
          for f in sorted(glob.glob("results/latency_bs*.json")):
              d=json.load(open(f))
              bs=int(os.path.basename(f).split("bs")[1].split(".")[0])
              hist.append({"ts": ts, "batch_size": bs, "metrics": d, "meta": meta, "gpu": gpu})
          open(hist_path,"w").write(json.dumps(hist, indent=2))
          PY

          # Minimal site (first run only)
          if [ ! -f docs/index.html ]; then
            cat > docs/index.html <<'HTML'
          <!doctype html>
          <html>
          <head>
            <meta charset="utf-8"/>
            <meta name="viewport" content="width=device-width, initial-scale=1"/>
            <title>vLLM Latency — Llama 8B (TP=2)</title>
            <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
            <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
            <style>
              :root { --fg:#0f172a; --muted:#475569; --card:#fff; --bg:#f8fafc; }
              *{box-sizing:border-box}
              body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
              .wrap{max-width:1100px;margin:32px auto;padding:0 16px}
              header{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-bottom:12px}
              a{color:#2563eb;text-decoration:none}
              canvas{background:var(--card);border-radius:16px;box-shadow:0 10px 30px rgba(2,6,23,.06);padding:16px}
              .muted{color:var(--muted)}
              code{background:#e2e8f0;padding:2px 6px;border-radius:6px}
            </style>
          </head>
          <body>
            <div class="wrap">
              <header>
                <h1>vLLM Latency — Llama 8B (TP=2)</h1>
                <a class="muted" href="./data/latency_history.json">raw JSON</a>
              </header>
              <p class="muted">Auto-updated hourly from GitHub Actions. Lines show <em>Avg</em> and <em>P95</em> latency per batch size.</p>
              <canvas id="chart" height="120"></canvas>
            </div>
            <script>
              async function main(){
                const resp = await fetch('./data/latency_history.json', {cache:'no-store'});
                const hist = await resp.json();
                const by = {};
                for(const r of hist){
                  const m=r.metrics;
                  const t=new Date(r.ts);
                  const bs=r.batch_size;
                  const avg=(m.avg_latency ?? m.avg_latency_s ?? m.avg_latency_seconds);
                  const p95=(m.p95_latency ?? m.p95 ?? m.p95_latency_s);
                  if(avg==null || p95==null) continue;
                  // heuristic: convert seconds -> ms if small
                  const toMs = v => (v<50 ? v*1000 : v);
                  by[bs] = by[bs] || {avg:[], p95:[]};
                  by[bs].avg.push({x:t, y:toMs(avg)});
                  by[bs].p95.push({x:t, y:toMs(p95)});
                }
                const ds=[];
                const add=(label,key)=>Object.keys(by).sort((a,b)=>a-b).forEach(bs=>{
                  ds.push({label:`${label} (bs=${bs})`, data: by[bs][key], borderWidth:2, fill:false, tension:.2});
                });
                add('Avg ms','avg'); add('P95 ms','p95');
                const ctx=document.getElementById('chart').getContext('2d');
                new Chart(ctx,{type:'line', data:{datasets:ds}, options:{
                  parsing:false,
                  interaction:{mode:'nearest',intersect:false},
                  scales:{x:{type:'time'}, y:{title:{display:true,text:'Latency (ms)'}}},
                  plugins:{legend:{position:'bottom'}}
                }});
              }
              main();
            </script>
          </body>
          </html>
          HTML
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "bench: append latency results & update chart data [skip ci]" || echo "No changes to commit"
          git push