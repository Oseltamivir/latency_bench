name: vLLM Llama 8B Latency #!TODO

on:
  schedule:
    - cron: "0 0 * * 0"  # Weekly placeholder (UTC)
  workflow_dispatch:
    inputs:
      model_id:
        description: "HF model id to benchmark"
        required: false
        type: string
      input_len:
        description: "Input sequence length (tokens)"
        required: false
        type: number
      output_len:
        description: "Output sequence length (tokens)"
        required: false
        type: number
      min_bs:
        description: "Minimum batch size (optional if you pass bs_list)"
        required: false
        type: number
      max_bs:
        description: "Maximum batch size (optional if you pass bs_list)"
        required: false
        type: number
      bs_list:
        description: "Explicit batch sizes (e.g. '1 2 4 8'); overrides min/max"
        required: false
        type: string
  workflow_call:
    inputs:
      model_id:
        required: false
        type: string
      input_len:
        required: false
        type: number
      output_len:
        required: false
        type: number
      min_bs:
        required: false
        type: number
      max_bs:
        required: false
        type: number
      bs_list:
        required: false
        type: string
    secrets:
      LAMBDA_API_KEY:
        required: true
      LL_SSH_PRIVATE_KEY:
        required: true
      HF_TOKEN:
        required: false

permissions:
  contents: write   # commit docs/ + history for Pages
  actions: read

concurrency:
  group: vllm-latency
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODEL_ID: unsloth/Llama-3.2-1B-Instruct
      TP_SIZE: 2
      INPUT_LEN: 512
      OUTPUT_LEN: 128
      NUM_ITERS: 5
      NUM_WARMUP: 2
      CUDA_VISIBLE_DEVICES: 0,1
      BS_LIST: "1 2 4 8"
      LL_API_URL: https://cloud.lambdalabs.com/api/v1
      LL_REGION: ${{ vars.LL_REGION }}
      LL_INSTANCE_TYPE: ${{ vars.LL_INSTANCE_TYPE }}
      LL_SSH_KEY_NAME: ${{ vars.LL_SSH_KEY_NAME }}
      PAGES_BRANCH: gh-pages

    steps:
      - uses: actions/checkout@v4

      - name: Ensure results dir
        run: mkdir -p results

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # NEW: Resolve inputs -> effective config
      - name: Resolve dispatch inputs
        id: cfg
        shell: bash
        run: |
          set -euo pipefail

          # Coalesce inputs with defaults from env
          MODEL_ID_E="${{ inputs.model_id != '' && inputs.model_id || env.MODEL_ID }}"
          IN_E="${{ inputs.input_len != '' && inputs.input_len || env.INPUT_LEN }}"
          OUT_E="${{ inputs.output_len != '' && inputs.output_len || env.OUTPUT_LEN }}"

          if [[ -n "${{ inputs.bs_list }}" ]]; then
            BS_E="${{ inputs.bs_list }}"
          elif [[ -n "${{ inputs.min_bs }}" && -n "${{ inputs.max_bs }}" ]]; then
            min=${{ inputs.min_bs }}; max=${{ inputs.max_bs }}
            if [[ $min -le 0 || $max -lt $min ]]; then
              echo "Invalid min/max batch sizes"; exit 1
            fi
            # Powers-of-two sequence from min..max inclusive
            b="$min"; BS_E=""
            while [[ $b -le $max ]]; do BS_E="$BS_E $b"; b=$(( b*2 )); done
            BS_E="${BS_E# }"
          else
            BS_E="${{ env.BS_LIST }}"
          fi

          {
            echo "model_id=$MODEL_ID_E"
            echo "input_len=$IN_E"
            echo "output_len=$OUT_E"
            echo "bs_list=$BS_E"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Determine GPU configuration
        id: gpu_config
        shell: bash
        run: |
          GPU_COUNT=$(echo "$LL_INSTANCE_TYPE" | grep -oP '\d+(?=x)' || echo "1")
          echo "gpu_count=$GPU_COUNT" | tee -a "$GITHUB_OUTPUT"
          if [[ "$GPU_COUNT" == "1" ]]; then
            echo "tp_size=1"         | tee -a "$GITHUB_OUTPUT"
            echo "cuda_devices=0"    | tee -a "$GITHUB_OUTPUT"
          else
            echo "tp_size=$TP_SIZE"  | tee -a "$GITHUB_OUTPUT"
            echo "cuda_devices=$CUDA_VISIBLE_DEVICES" | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Launch Lambda Cloud instance
        id: launch
        env:
          LAMBDA_API_KEY: ${{ secrets.LAMBDA_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${LL_REGION:-}" && -n "${LL_INSTANCE_TYPE:-}" && -n "${LL_SSH_KEY_NAME:-}" ]] || { echo "Missing Lambda Cloud repo vars."; exit 1; }
          [[ -n "${LAMBDA_API_KEY:-}" ]] || { echo "secrets.LAMBDA_API_KEY must be set."; exit 1; }

          CREATE_RESP=$(curl -fsS -X POST \
            -H "Authorization: Bearer ${LAMBDA_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg region "$LL_REGION" --arg type "$LL_INSTANCE_TYPE" --arg key "$LL_SSH_KEY_NAME" '{region_name:$region, instance_type_name:$type, ssh_key_names:[$key], quantity:1}')" \
            "$LL_API_URL/instance-operations/launch")
          echo "$CREATE_RESP" > create_instance.json

          INSTANCE_ID=$(jq -r '(.data.instance_ids[0] // .instance_ids[0] // .data.instances[0].id // .data[0].id // .instances[0].id // empty)' create_instance.json)
          [[ -n "$INSTANCE_ID" && "$INSTANCE_ID" != "null" ]] || { echo "Failed to parse instance ID"; cat create_instance.json; exit 1; }
          echo "instance_id=$INSTANCE_ID" | tee -a "$GITHUB_OUTPUT"

      - name: Wait for instance to be running and get IP
        id: wait
        env:
          LAMBDA_API_KEY: ${{ secrets.LAMBDA_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          ID=${{ steps.launch.outputs.instance_id }}
          sleep 240
          for i in {1..60}; do
            RESP=$(curl -fsS -H "Authorization: Bearer ${LAMBDA_API_KEY}" "$LL_API_URL/instances/$ID" || true)
            echo "$RESP" > instance_${ID}.json
            STATE=$(jq -r '(.data.status // .data.instance.status // .data.instance.state // .status // "")' instance_${ID}.json)
            IP=$(jq -r '(.data.ip // .data.instance.ip // .data.instance.network.ip_addresses[0].ip_address // .data.instance.ip_address // .data.ip_address // .data.instance.public_ip // "")' instance_${ID}.json)
            echo "state=$STATE ip=$IP"
            if [[ "$STATE" =~ ^(running|active)$ ]] && [[ -n "$IP" && "$IP" != "null" ]]; then
              echo "instance_ip=$IP" | tee -a "$GITHUB_OUTPUT"
              break
            fi
            sleep 10
          done
          [[ -n "${IP:-}" && "$IP" != "null" ]] || { echo "Timed out waiting for instance IP"; exit 1; }

      - name: Install SSH key
        id: sshkey
        env:
          LL_SSH_PRIVATE_KEY: ${{ secrets.LL_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${LL_SSH_PRIVATE_KEY:-}" ]] || { echo "secrets.LL_SSH_PRIVATE_KEY must be set."; exit 1; }
          mkdir -p ~/.ssh
          echo "$LL_SSH_PRIVATE_KEY" > ~/.ssh/lambda_key
          chmod 600 ~/.ssh/lambda_key
          ssh-keyscan -H ${{ steps.wait.outputs.instance_ip }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Run latency bench on Lambda instance
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ACTUAL_TP_SIZE: ${{ steps.gpu_config.outputs.tp_size }}
          ACTUAL_CUDA_DEVICES: ${{ steps.gpu_config.outputs.cuda_devices }}
          MODEL_ID_RES:   ${{ steps.cfg.outputs.model_id }}
          INPUT_LEN_RES:  ${{ steps.cfg.outputs.input_len }}
          OUTPUT_LEN_RES: ${{ steps.cfg.outputs.output_len }}
          BS_LIST_RES:    ${{ steps.cfg.outputs.bs_list }}
        shell: bash
        run: |
          set -euo pipefail
          REMOTE=ubuntu@${{ steps.wait.outputs.instance_ip }}

          ssh -i ~/.ssh/lambda_key -o StrictHostKeyChecking=no "$REMOTE" \
            "export PATH=\$HOME/.local/bin:\$PATH; \
             export HUGGING_FACE_HUB_TOKEN='${HF_TOKEN}'; \
             export CUDA_VISIBLE_DEVICES='${ACTUAL_CUDA_DEVICES}'; \
             export ACTUAL_TP_SIZE='${ACTUAL_TP_SIZE}'; \
             export MODEL_ID='${MODEL_ID_RES}'; \
             export INPUT_LEN='${INPUT_LEN_RES}'; \
             export OUTPUT_LEN='${OUTPUT_LEN_RES}'; \
             export NUM_ITERS='${NUM_ITERS}'; \
             export NUM_WARMUP='${NUM_WARMUP}'; \
             export BS_LIST='${BS_LIST_RES}'; \
             bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          mkdir -p ~/results
          cd ~/results

          # Env
          python3 -m venv ~/vllm-venv
          source ~/vllm-venv/bin/activate
          python -m pip install --upgrade pip
          export HF_HUB_ENABLE_HF_TRANSFER=1
          export TRANSFORMERS_NO_TF=1
          export TRANSFORMERS_NO_FLAX=1
          export PYTHONNOUSERSITE=1
          pip install "vllm[bench]>=0.10.0" hf_transfer

          # Record versions + GPU
          nvidia-smi --query-gpu=name,memory.total,driver_version --format=csv,noheader | tee gpu.txt
          python - <<'PY'
          import json, platform, sys, importlib
          info={"python":sys.version.split()[0],"torch":None,"vllm":None,"platform":platform.platform()}
          for m in ("torch","vllm"):
              try: info[m]=importlib.import_module(m).__version__
              except Exception: pass
          open("env.json","w").write(json.dumps(info, indent=2))
          PY

          # Bench — write a JSON per batch size (+ keep stdout logs)
          for B in ${BS_LIST}; do
            echo "==> bench bs=${B}"
            vllm bench latency \
              --model "${MODEL_ID}" \
              --tensor-parallel-size "${ACTUAL_TP_SIZE}" \
              --batch-size "${B}" \
              --input-len "${INPUT_LEN}" \
              --output-len "${OUTPUT_LEN}" \
              --num-iters "${NUM_ITERS}" \
              --num-iters-warmup "${NUM_WARMUP}" \
              --output-json "latency_bs${B}.json" | tee "latency_bs${B}.log"
          done
          REMOTE_SCRIPT

      - name: Download results from instance
        shell: bash
        run: |
          set -euo pipefail
          REMOTE=ubuntu@${{ steps.wait.outputs.instance_ip }}
          scp -i ~/.ssh/lambda_key -o StrictHostKeyChecking=no -r "$REMOTE:results/." ./results
          echo "Downloaded files:"; ls -lah results; echo; find results -maxdepth 2 -type f -print

      - name: Terminate Lambda Cloud instance
        if: always()
        env:
          LAMBDA_API_KEY: ${{ secrets.LAMBDA_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          ID=${{ steps.launch.outputs.instance_id }}
          curl -fsS -X POST -H "Authorization: Bearer ${LAMBDA_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"instance_ids\":[\"$ID\"]}" \
            "$LL_API_URL/instance-operations/terminate" || true

      - name: Upload artifacts (JSON + logs + env)
        uses: actions/upload-artifact@v4
        with:
          name: vllm-latency-${{ github.run_id }}
          path: |
            results/latency_bs*.json
            results/latency_bs*.log
            results/env.json
            results/gpu.txt
          if-no-files-found: error

      - name: Add markdown table to Job Summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, json, os

          def to_ms(x):
              if x is None:
                  return None
              return x * 1000.0 if x < 50 else x  # assume seconds if <50s

          files = sorted(glob.glob("results/latency_bs*.json"))
          rows = []
          for f in files:
              d = json.load(open(f))
              bs = int(os.path.basename(f).split("bs")[1].split(".")[0])
              avg = to_ms(d.get("avg_latency"))
              percentiles = d.get("percentiles", {})
              p10 = to_ms(percentiles.get("10"))
              p25 = to_ms(percentiles.get("25"))
              p50 = to_ms(percentiles.get("50"))
              p75 = to_ms(percentiles.get("75"))
              p90 = to_ms(percentiles.get("90"))
              p99 = to_ms(percentiles.get("99"))
              rows.append((bs, avg, p10, p25, p50, p75, p90, p99))

          print("## vLLM Latency — Llama 8B (TP=${{ steps.gpu_config.outputs.tp_size }})")
          print()
          print("| Batch | Avg (ms) | P10 | P25 | P50 | P75 | P90 | P99 |")
          print("|---:|---:|---:|---:|---:|---:|---:|---:|")
          for r in rows:
              bs, avg, p10, p25, p50, p75, p90, p99 = r
              fm = lambda x: ("" if x is None else f"{x:.1f}")
              print(f"| {bs} | {fm(avg)} | {fm(p10)} | {fm(p25)} | {fm(p50)} | {fm(p75)} | {fm(p90)} | {fm(p99)} |")
          PY

      - name: Update GitHub Pages data only
        run: |
          set -euo pipefail
          cp -r results _results_tmp

          git fetch origin $PAGES_BRANCH || true
          if git show-ref --verify --quiet refs/heads/$PAGES_BRANCH; then
            git switch $PAGES_BRANCH
          elif git show-ref --verify --quiet refs/remotes/origin/$PAGES_BRANCH; then
            git switch --create $PAGES_BRANCH origin/$PAGES_BRANCH
          else
            git switch --orphan $PAGES_BRANCH
            git rm -rf . >/dev/null 2>&1 || true
          fi

          mkdir -p docs/data
          [ -f docs/data/latency_history.json ] || echo "[]" > docs/data/latency_history.json
          cp -r _results_tmp results

          python - <<'PY'
          import glob, json, os, time
          ts = int(time.time()*1000)
          hist_path = "docs/data/latency_history.json"
          hist = json.load(open(hist_path))
          meta = json.load(open("results/env.json"))
          gpu = open("results/gpu.txt").read().strip() if os.path.exists("results/gpu.txt") else ""

          for f in sorted(glob.glob("results/latency_bs*.json")):
              d = json.load(open(f))
              bs = int(os.path.basename(f).split("bs")[1].split(".")[0])

              if "percentiles" not in d:
                  d["percentiles"] = {}

              hist.append({
                  "ts": ts,
                  "batch_size": bs,
                  "metrics": d,
                  "meta": meta,
                  "gpu": gpu
              })

          open(hist_path, "w").write(json.dumps(hist, indent=2))
          PY

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git commit -m "bench: append latency data [skip ci]" || echo "No data changes"
          git push origin $PAGES_BRANCH
      
      - name: Notify Slack (success/failure)
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTUAL_TP_SIZE: ${{ steps.gpu_config.outputs.tp_size }}
          GPU_COUNT: ${{ steps.gpu_config.outputs.gpu_count }}
          MODEL_ID_RES:   ${{ steps.cfg.outputs.model_id }}
          INPUT_LEN_RES:  ${{ steps.cfg.outputs.input_len }}
          OUTPUT_LEN_RES: ${{ steps.cfg.outputs.output_len }}
          BS_LIST_RES:    ${{ steps.cfg.outputs.bs_list }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$JOB_STATUS" = "success" ]; then
            EMOJI=":white_check_mark:"; COLOR="#2eb886"
          elif [ "$JOB_STATUS" = "cancelled" ]; then
            EMOJI=":warning:"; COLOR="#daa038"
          else
            EMOJI=":x:"; COLOR="#e01e5a"
          fi

          TITLE="$EMOJI vLLM Latency — TP=${ACTUAL_TP_SIZE} (GPUx${GPU_COUNT}) — ${JOB_STATUS^^}"
          SUB="Repo \`${{ github.repository }}\` • Branch \`${BRANCH}\` • Commit \`${SHA:0:7}\`"
          CFG="Model \`${MODEL_ID_RES}\` • BS \`${BS_LIST_RES}\` • In ${INPUT_LEN_RES} / Out ${OUTPUT_LEN_RES} • iters ${NUM_ITERS} (warmup ${NUM_WARMUP})"

          payload=$(jq -n \
            --arg title "$TITLE" \
            --arg sub "$SUB" \
            --arg cfg "$CFG" \
            --arg run "$RUN_URL" \
            --arg color "$COLOR" '
            {
              attachments: [
                {
                  color: $color,
                  blocks: [
                    { "type": "section", "text": { "type": "mrkdwn", "text": $title } },
                    { "type": "context", "elements": [ { "type": "mrkdwn", "text": $sub } ] },
                    { "type": "context", "elements": [ { "type": "mrkdwn", "text": $cfg } ] },
                    { "type": "actions", "elements": [
                      { "type": "button", "text": { "type": "plain_text", "text": "View GitHub Run" }, "url": $run }
                    ]}
                  ]
                }
              ]
            }')

          curl -fsS -X POST -H 'Content-Type: application/json' \
            --data "$payload" \
            "$SLACK_WEBHOOK_URL" || echo "Slack notify failed (continuing)"